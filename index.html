<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/jpeg" href="/assets/icon_dragon_cannon.jpg" />
    <link rel="apple-touch-icon" href="/assets/icon_dragon_cannon.jpg" />
    <title>孤城神机营</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }
      #game-container {
        width: 100%;
        height: 100%;
        max-width: 750px;
        max-height: 1334px;
        position: relative;
        overflow: hidden;
        touch-action: none;
      }
      canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
